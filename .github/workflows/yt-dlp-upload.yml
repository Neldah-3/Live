name: Download YouTube Playlist & Upload per Video

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "URL Playlist atau Video YouTube"
        required: true
        default: "https://www.youtube.com/playlist?list=PLX15XB_3XZuR7NjjcnxLr770zy4PLWut_"
        type: string
      mode:
        description: "Metode unggah ke GitHub (release = hingga 2GB/part, repo = folder videos/ <95MB)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - repo
      quality:
        description: "Kualitas video"
        required: true
        default: "best"
        type: choice
        options:
          - best
          - 1080p
          - 720p
          - 480p
          - 360p
          - audio
      max_downloads:
        description: "Batas jumlah video pada sesi ini (kosongkan untuk semua)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: yt-dlp-playlist-upload
  cancel-in-progress: false

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp & dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt "yt-dlp[default,curl-cffi]"

      - name: Prepare optional YouTube cookies
        env:
          YOUTUBE_COOKIES_SECRET: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_SECRET" ]; then
            COOKIES_FILE="$RUNNER_TEMP/youtube_cookies.txt"
            printf '%s\n' "$YOUTUBE_COOKIES_SECRET" > "$COOKIES_FILE"
            chmod 600 "$COOKIES_FILE"
            echo "YOUTUBE_COOKIES_FILE=$COOKIES_FILE" >> "$GITHUB_ENV"
            echo "Menggunakan secret YOUTUBE_COOKIES."
          fi

      - name: Download 1-by-1 & upload each video to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_URL: ${{ inputs.playlist_url }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_QUALITY: ${{ inputs.quality }}
          INPUT_MAX_DOWNLOADS: ${{ inputs.max_downloads }}
        run: |
          ARGS=(
            "$INPUT_URL"
            --mode "$INPUT_MODE"
            --quality "$INPUT_QUALITY"
            --max-runtime-minutes 330
          )
          if [ -n "$INPUT_MAX_DOWNLOADS" ]; then
            ARGS+=(--max-downloads "$INPUT_MAX_DOWNLOADS")
          fi
          python download_and_upload.py "${ARGS[@]}"

      - name: Cleanup temporary cookies
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/youtube_cookies.txt"
